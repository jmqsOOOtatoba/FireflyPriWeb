<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f59e0b' d='M16 2c1.5 6 6 9.5 12 11-6 1.5-10.5 5-12 11-1.5-6-6-9.5-12-11 6-1.5 10.5-5 12-11z'/%3E%3C/svg%3E"
		/>
		<title>Firefly 发布台</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f7f8;
				--card: #ffffff;
				--ink: #1a1a1c;
				--muted: #6b6b70;
				--line: #e4e4e7;
				--accent: #d97706;
				--accent-ink: #ffffff;
				--ok: #16a34a;
				--ok-bg: #f0fdf4;
				--ok-line: #bbf7d0;
				--err: #dc2626;
				--err-bg: #fef2f2;
				--err-line: #fecaca;
				--field-bg: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f1115;
					--card: #17191e;
					--ink: #e8e8ea;
					--muted: #9a9aa3;
					--line: #2a2d35;
					--accent: #f59e0b;
					--accent-ink: #1a1200;
					--ok: #4ade80;
					--ok-bg: #0d2215;
					--ok-line: #14532d;
					--err: #f87171;
					--err-bg: #2a1215;
					--err-line: #7f1d1d;
					--field-bg: #101216;
				}
			}
			* {
					box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
			}
			body {
				background: var(--bg);
				color: var(--ink);
				font-family:
					-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
					"Segoe UI", sans-serif;
				font-size: 15px;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
				padding: 24px 16px 48px;
			}
			.wrap {
				max-width: 720px;
				margin: 0 auto;
			}
			header {
				margin-bottom: 20px;
			}
			header h1 {
				font-size: 22px;
				font-weight: 700;
				margin: 0 0 4px;
				letter-spacing: 0.02em;
			}
			header h1 .fly {
				color: var(--accent);
			}
			header p {
				margin: 0;
				color: var(--muted);
				font-size: 13px;
			}
			.card {
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 14px;
				padding: 20px;
				margin-bottom: 16px;
			}
			label {
				display: block;
				font-size: 13px;
				font-weight: 600;
				margin-bottom: 6px;
				color: var(--ink);
			}
			.hint {
				font-weight: 400;
				color: var(--muted);
				margin-left: 6px;
			}
			input[type="text"],
			input[type="password"],
			textarea {
				width: 100%;
				background: var(--field-bg);
				color: var(--ink);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 10px 12px;
				font-size: 15px;
				font-family: inherit;
				outline: none;
				transition: border-color 0.15s;
			}
			input:focus,
			textarea:focus {
				border-color: var(--accent);
			}
			textarea {
				min-height: 240px;
				resize: vertical;
				font-family: ui-monospace, "SF Mono", Consolas, "Microsoft YaHei", monospace;
				font-size: 14px;
				line-height: 1.7;
			}
			textarea.short {
				min-height: 72px;
			}
			.row {
				display: flex;
				gap: 10px;
				align-items: end;
			}
			.row > div {
				flex: 1;
				min-width: 0;
			}
			.seg {
				display: flex;
				gap: 6px;
				background: var(--bg);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 4px;
				margin-bottom: 18px;
			}
			.seg button {
				flex: 1;
				border: 0;
				background: transparent;
				color: var(--muted);
				font: inherit;
				font-size: 14px;
				font-weight: 600;
				padding: 8px 4px;
				border-radius: 7px;
				cursor: pointer;
				transition:
					background 0.15s,
					color 0.15s;
			}
			.seg button.active {
				background: var(--card);
				color: var(--ink);
				box-shadow: 0 1px 3px rgb(0 0 0 / 0.12);
			}
			.field {
				margin-bottom: 16px;
			}
			.hidden {
				display: none;
			}
			details {
				border: 1px dashed var(--line);
				border-radius: 10px;
				padding: 10px 14px;
				margin-bottom: 16px;
			}
			details summary {
				cursor: pointer;
				font-size: 13px;
				font-weight: 600;
				color: var(--muted);
				user-select: none;
			}
			details[open] summary {
				margin-bottom: 12px;
				color: var(--ink);
			}
			.check {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 14px;
				cursor: pointer;
			}
			.check input {
				width: 16px;
				height: 16px;
				accent-color: var(--accent);
			}
			.publish-btn {
				width: 100%;
				border: 0;
				border-radius: 10px;
				background: var(--accent);
				color: var(--accent-ink);
				font: inherit;
				font-size: 16px;
				font-weight: 700;
				padding: 13px;
				cursor: pointer;
				transition: opacity 0.15s;
			}
			.publish-btn:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}
			.result {
				border-radius: 10px;
				padding: 12px 14px;
				font-size: 14px;
				margin-top: 14px;
				word-break: break-all;
			}
			.result.ok {
				background: var(--ok-bg);
				border: 1px solid var(--ok-line);
				color: var(--ok);
			}
			.result.err {
				background: var(--err-bg);
				border: 1px solid var(--err-line);
				color: var(--err);
			}
			.result code {
				font-size: 13px;
				background: rgb(0 0 0 / 0.06);
				padding: 1px 5px;
				border-radius: 4px;
			}
			footer {
				text-align: center;
				color: var(--muted);
				font-size: 12px;
			}
			footer a {
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<h1><span class="fly">◈</span> Firefly 发布台</h1>
				<p>写好 Markdown，选类型，一键提交到博客仓库自动上线</p>
			</header>

			<div class="card">
				<div class="field">
					<label for="token">访问口令</label>
					<input
						type="password"
						id="token"
						placeholder="发布口令（与服务端 PUBLISH_TOKEN 一致）"
						autocomplete="current-password"
					/>
				</div>

				<div class="seg" role="tablist" aria-label="内容类型">
					<button type="button" data-type="post" class="active">文章</button>
					<button type="button" data-type="update">更新公告</button>
					<button type="button" data-type="dynamic">动态</button>
				</div>

				<div class="field" id="title-field">
					<label for="title">标题</label>
					<input type="text" id="title" placeholder="文章标题" />
				</div>

				<div class="field">
					<label for="content">正文 <span class="hint">Markdown，图片贴外链</span></label>
					<textarea
						id="content"
						placeholder="## 小标题&#10;&#10;在这里粘贴写好的 Markdown 正文……"
					></textarea>
				</div>

				<details id="extras">
					<summary>可选字段</summary>
					<div class="field" id="f-description">
						<label for="description">描述<span class="hint">文章列表摘要</span></label>
						<textarea class="short" id="description"></textarea>
					</div>
					<div class="row">
						<div class="field" id="f-tags">
							<label for="tags">标签<span class="hint">逗号分隔</span></label>
							<input type="text" id="tags" placeholder="教程, Windows" />
						</div>
						<div class="field" id="f-category">
							<label for="category">分类</label>
							<input type="text" id="category" placeholder="技术分享" />
						</div>
					</div>
					<div class="field" id="f-location">
						<label for="location">位置<span class="hint">仅动态</span></label>
						<input type="text" id="location" placeholder="辽宁" />
					</div>
					<div class="field" id="f-author">
						<label for="author">作者</label>
						<input type="text" id="author" placeholder="左沐" />
					</div>
					<div class="field hidden" id="f-pinned">
						<label class="check"><input type="checkbox" id="pinned" /> 置顶这条内容</label>
					</div>
				</details>

				<button type="button" class="publish-btn" id="publish">发布</button>
				<div class="result hidden" id="result"></div>
			</div>

			<footer>
				内容经 GitHub 自动提交至博客仓库，构建约 3~5 分钟后生效
			</footer>
		</div>

		<script>
			const $ = (id) => document.getElementById(id);
			const TOKEN_KEY = "firefly_publish_token";
			let type = "post";

			$("token").value = localStorage.getItem(TOKEN_KEY) || "";

			const typeConf = {
				post: { title: "文章标题", show: ["f-description", "f-tags", "f-category", "f-author"] },
				update: { title: "留空则自动命名（更新公告+日期）", show: ["f-description", "f-tags", "f-category", "f-author"] },
				dynamic: { title: null, show: ["f-location", "f-pinned"] },
			};

			function applyType(next) {
				type = next;
				const conf = typeConf[next];
				$("title-field").classList.toggle("hidden", !conf.title);
				$("title").placeholder = conf.title || "";
				for (const id of ["f-description", "f-tags", "f-category", "f-location", "f-author", "f-pinned"]) {
					$(id).classList.toggle("hidden", !conf.show.includes(id));
				}
				document.querySelectorAll(".seg button").forEach((b) => {
					b.classList.toggle("active", b.dataset.type === next);
				});
			}
			document.querySelectorAll(".seg button").forEach((b) => {
				b.addEventListener("click", () => applyType(b.dataset.type));
			});
			applyType("post");

			function showResult(kind, html) {
				const el = $("result");
				el.className = `result ${kind}`;
				el.innerHTML = html;
			}

			$("publish").addEventListener("click", async () => {
				const token = $("token").value.trim();
				const content = $("content").value;
				const title = $("title").value.trim();
				if (!token) {
					showResult("err", "请先填写访问口令");
					return;
				}
				if (type === "post" && !title) {
					showResult("err", "文章标题不能为空");
					return;
				}
				if (!content.trim()) {
					showResult("err", "正文内容不能为空");
					return;
				}

				const payload = {
					type,
					title,
					content,
					description: $("description").value,
					tags: $("tags").value,
					category: $("category").value,
					location: $("location").value,
					author: $("author").value,
					pinned: $("pinned").checked,
				};

				const btn = $("publish");
				btn.disabled = true;
				btn.textContent = "发布中…";
				try {
					const res = await fetch("/api/publish", {
						method: "POST",
						headers: { "Content-Type": "application/json", "x-publish-token": token },
						body: JSON.stringify(payload),
					});
					const data = await res.json().catch(() => ({}));
					if (res.ok && data.ok) {
						localStorage.setItem(TOKEN_KEY, token);
						showResult("ok", `已提交 · ${data.message}<br/>文件：<code>${data.path}</code>`);
						$("content").value = "";
						if (type === "post") $("title").value = "";
					} else {
						showResult("err", `发布失败：${data.error || `HTTP ${res.status}`}`);
					}
				} catch (e) {
					showResult("err", `网络错误：${e.message}`);
				} finally {
					btn.disabled = false;
					btn.textContent = "发布";
				}
			});
		</script>
	</body>
</html>
